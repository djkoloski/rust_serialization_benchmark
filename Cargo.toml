[workspace]
members = [
    "pages",
    "protobuf4-generated",
    "tools/bencher",
    "tools/formatter",
    "tools/parser",
    "tools/schema",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
cargo_metadata = "0.15"
clap = "4"
enum-iterator = "0.8"
eyre = "0.6.12"
fixed-map = { version = "0.9", default-features = false }
regex = "1.12"
schema = { path = "tools/schema" }
semver = "1.0.28"
serde = "1.0"
serde_json = "1.0"
stylist = { version = "0.15", default-features = false }
tempfile = "3.27"
time = "0.3"
wasm-bindgen = "0.2"
web-sys = "0.3.102"
yew = { version = "0.23", default-features = false }

[package]
name = "rust_serialization_benchmark"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
bilrost = { version = "=0.1015.0", optional = true }
bin-proto = { version = "=0.12.8", features = ["prepend-tags"], optional = true }
bitcode = { version = "=0.6.9", optional = true }
borsh = { version = "=1.8.0", features = ["derive"], optional = true }
buffa = { version = "=0.9.1", optional = true }
capnp = { version = "=0.27.0", optional = true }
cbor4ii = { version = "=1.2.2", features = [
    "use_std",
    "serde1",
], optional = true }
ciborium = { version = "=0.2.2", optional = true }
flatbuffers = { version = "=25.12.19", optional = true }
flexbuffers = { version = "=25.12.19", optional = true }
flexon = { version = "=0.4.8", features = [
    "serde",
    "simd",
    "std",
], optional = true, default-features = false }
minicbor = { version = "=2.3.0", optional = true, features = [
    "alloc",
    "derive",
] }
msgpacker = { version = "=0.7.1", optional = true }
nanoserde = { version = "=0.2.1", optional = true }
postcard = { version = "=1.1.3", features = ["alloc"], optional = true }
prost = { version = "=0.14.4", optional = true }
protobuf = { version = "=3.7.2", optional = true }
# NOTE: remember to change this version here, down below on protobuf4-codegen, and in
# protobuf4-generated/Cargo.toml
protobuf4 = { package = "protobuf", version = "=4.35.1-release", optional = true }
protobuf4-generated = { path = "protobuf4-generated", optional = true }
rkyv = { version = "=0.8.18", optional = true }
rmp-serde = { version = "=1.3.1", optional = true }
ron = { version = "=0.12.2", optional = true }
savefile = { version = "=0.20.5", optional = true }
savefile-derive = { version = "=0.20.5", optional = true }
serde_json = { version = "=1.0.151", features = [
    "float_roundtrip",
], optional = true }
serde-zap = { version = "=0.1.0", optional = true }
simd-json = { version = "=0.17.3", optional = true }
simd-json-derive = { version = "=0.18.0", optional = true }
wincode = { version = "=0.6.0", optional = true, features = ["derive"] }
zerompk = { version = "=0.7.1", optional = true, features = ["derive"] }

criterion = "=0.5.1"
libflate = "=2.3.1"
pprof = { version = "=0.15.0", features = ["flamegraph"], optional = true }
rand = "=0.8.5"
serde = { version = "=1.0.229", features = ["derive"] }
zstd = "=0.13.3"

[features]
default = ["default-encoding-set", "measure-compression"]
default-encoding-set = [
    "bilrost",
    "bin-proto",
    "bitcode",
    "borsh",
    "buffa",
    "capnp",
    "cbor4ii",
    "ciborium",
    "flatbuffers",
    "flexbuffers",
    "flexon",
    "minicbor",
    "msgpacker",
    "nanoserde",
    "postcard",
    "prost",
    "protobuf",
    "protobuf4",
    "rkyv",
    "rmp-serde",
    "ron",
    "savefile",
    "serde_json",
    "serde-zap",
    "simd-json",
    "wincode",
    "zerompk",
]

# Grouped features for comparing different implementations for a specific encoding
all-cbor = ["cbor4ii", "ciborium"]
all-messagepack = ["msgpacker", "rmp-serde", "zerompk"]
all-json = ["flexon", "serde_json", "simd-json"]
all-protobuf = ["buffa", "prost", "protobuf", "protobuf4"]

measure-compression = []
buffa = ["dep:buffa"]
capnp = ["dep:capnp"]
prost = ["dep:prost", "dep:capnp"]
protobuf = ["dep:protobuf"]
protobuf4 = ["dep:protobuf4", "dep:protobuf4-generated"]
simd-json = ["dep:simd-json", "dep:simd-json-derive"]
savefile = ["dep:savefile", "dep:savefile-derive"]
zerompk = ["dep:zerompk"]

# Enable these features to regenerate generated files rather than using the committed versions.
regenerate = [
    "regenerate-buffa",
    "regenerate-capnp",
    "regenerate-flatbuffers",
    "regenerate-prost",
    "regenerate-protobuf",
    "regenerate-protobuf4",
]
regenerate-buffa = ["dep:buffa-build"]
regenerate-capnp = ["dep:capnpc"]
regenerate-flatbuffers = ["dep:flatc-rust"]
regenerate-prost = ["dep:prost-build"]
regenerate-protobuf = ["dep:protobuf-codegen"]
regenerate-protobuf4 = ["dep:protobuf4-codegen"]

[dev-dependencies]
rand_pcg = "0.3.1"

[build-dependencies]
buffa-build = { version = "=0.9.1", optional = true }
capnp = "=0.27.0"
capnpc = { version = "=0.27.0", optional = true }
flatc-rust = { version = "=0.2.0", optional = true }
prost-build = { version = "=0.14.4", optional = true }
protobuf-codegen = { version = "=3.7.2", optional = true }
protobuf4-codegen = { package = "protobuf-codegen", version = "=4.35.1-release", optional = true }

[[bench]]
harness = false
name = "bench"

[profile.bench]
lto = true
# Uncomment this to profile
# debug = true
